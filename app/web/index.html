  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F3F5F8;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background-color: #F3F5F8;
      transition: opacity 300ms ease-out;
      z-index: 9999;
    }
    #splash svg {
      width: 128px;
      height: 128px;
      border-radius: 30px;
      box-shadow: 0 18px 42px rgba(10, 108, 255, 0.22);
      animation: splash-pop 900ms cubic-bezier(0.22, 1.28, 0.36, 1) both;
    }
    #splash .spinner {
      width: 22px;
      height: 22px;
      border: 2.4px solid rgba(10, 108, 255, 0.2);
      border-top-color: #0A6CFF;
      border-radius: 50%;
      animation: splash-spin 750ms linear infinite;
    }
    @keyframes splash-pop {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background-color: #1B1D21; }
      #splash .spinner {
        border-color: rgba(10, 108, 255, 0.3);
        border-top-color: #2D82FF;
      }
    }
  </style>
</head>
<body>

  <script>
    (function () {
      var removed = false;
      function hideSplash() {
        if (removed) return;
        removed = true;
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 300);
      }

      window.addEventListener('flutter-first-frame', hideSplash);

      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) hideSplash();
      });
      observer.observe(document.body, { childList: true, subtree: true });

      setTimeout(hideSplash, 15000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
